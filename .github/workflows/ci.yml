name: Apex Ops API CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Enable intentional pipeline failure test"
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_FAIL: ${{ (github.ref == 'refs/heads/demo-failure' || inputs.force_fail) && 'true' || 'false' }}

jobs:

  # =====================================
  # JOB 1: LINT AND VALIDATION
  # =====================================
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: ESLint
        run: npm run lint
        working-directory: app

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck (scripts)
        run: shellcheck -x -S warning scripts/*.sh

      - name: Validate docker-compose.yml
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        run: |
          docker compose --env-file .env.example config --quiet

      - name: Make sure no .env file is committed
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "ERROR: A .env file is committed."
            echo "Remove it and rotate any exposed secrets."
            exit 1
          fi

  # =====================================
  # JOB 2: UNIT AND DATABASE TESTS
  # =====================================
  test:
    name: Test (unit + PostgreSQL integration)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ci; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Run tests
        run: npm test
        working-directory: app
        env:
          DATABASE_URL: postgres://ci:ci-only-not-a-real-secret@localhost:5432/ci

      - name: Intentional failure test (demo)
        if: env.FORCE_FAIL == 'true'
        run: |
          echo "Intentional failure demonstration"
          echo "This failure is expected when demo mode is enabled."
          exit 1

  # =====================================
  # JOB 3: DEPENDENCY SECURITY AUDIT
  # =====================================
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: app

  # =====================================
  # JOB 4: BUILD, SCAN AND PUBLISH IMAGE
  # =====================================
  build:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    needs: [test, audit]

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name and version
        id: meta
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="sha-${SHORT_SHA}"
          fi

          IMAGE="ghcr.io/${OWNER}/apex-ops-api"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg GIT_SHA="${{ steps.meta.outputs.short_sha }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            .

      - name: Check container runs as non-root
        run: |
          USER_ID="$(docker run --rm \
            --entrypoint id \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" -u)"

          echo "Container user ID: ${USER_ID}"

          test "${USER_ID}" != "0"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"

  # =====================================
  # JOB 5: DEPLOY AND SMOKE TEST
  # =====================================
  deploy:
    name: Deploy and smoke test
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create environment file
        run: bash./scripts/init-env.sh

      - name: Set image to deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if grep -q '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=${IMAGE}|" .env
          else
            echo "IMAGE=${IMAGE}" >> .env
          fi

      - name: Deploy the image that was just built
        run: |
          ./scripts/deploy.sh "${{ needs.build.outputs.version }}"

      - name: Smoke test
        run: |
          ./scripts/smoke.sh "${{ needs.build.outputs.version }}"

      - name: Collect evidence (logs)
        if: always()
        run: |
          mkdir -p evidence-ci
          docker compose ps > evidence-ci/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > evidence-ci/compose-logs.txt 2>&1 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence
          path: evidence-ci/
          if-no-files-found: warn
          retention-days: 14